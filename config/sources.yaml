  # ── 酒店（降权，默认不进主列表选优前列） ────────────
  - key: "ccsh-hotel"
    url: "https://raw.githubusercontent.com/CCSH/IPTV/main/live_lite.txt"
    type: "txt"
    enabled: true
    region: hotel
    priority: 80
    core: false
    # 精简酒店源；公网用户可能无法播
