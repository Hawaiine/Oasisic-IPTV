# Oasisic-IPTV 采集源配置
# key 全局唯一；type: m3u|txt；enabled: true/false
# region: cn|hk_tw|overseas|hotel|radio

sources:
  # ── 国内/中文热门源 ──────────────────────────────────
  - name: "fanmingming-ipv6"
    url: "https://raw.githubusercontent.com/fanmingming/live/main/tv/m3u/ipv6.m3u"
    type: "m3u"
    enabled: true
    region: cn

  - name: "yuechan-cn"
    url: "https://raw.githubusercontent.com/YueChan/Live/main/IPTV.m3u"
    type: "m3u"
    enabled: true
    region: cn

  - name: "guovin-iptv-api"
    url: "https://raw.githubusercontent.com/Guovin/iptv-api/gd/output/result.m3u"
    type: "m3u"
    enabled: true
    region: cn

  - name: "iptv-org-cn"
    url: "https://iptv-org.github.io/iptv/countries/cn.m3u"
    type: "m3u"
    enabled: true
    region: cn

  - name: "iptv-org-hk"
    url: "https://iptv-org.github.io/iptv/countries/hk.m3u"
    type: "m3u"
    enabled: true
    region: hk_tw

  - name: "iptv-org-tw"
    url: "https://iptv-org.github.io/iptv/countries/tw.m3u"
    type: "m3u"
    enabled: true
    region: hk_tw

  # ── 酒店/特殊源 ──────────────────────────────────────
  - name: "ccsh-hotel"
    url: "https://raw.githubusercontent.com/CCSH/IPTV/main/live_lite.txt"
    type: "txt"
    enabled: true
    region: hotel

  # ── 国际源（少量，降权） ──────────────────────────────
  - name: "free-tv-global"
    url: "https://raw.githubusercontent.com/Free-TV/IPTV/master/playlist.m3u8"
    type: "m3u"
    enabled: true
    region: overseas

  - name: "iptv-org-jp"
    url: "https://iptv-org.github.io/iptv/countries/jp.m3u"
    type: "m3u"
    enabled: true
    region: overseas

  - name: "iptv-org-kr"
    url: "https://iptv-org.github.io/iptv/countries/kr.m3u"
    type: "m3u"
    enabled: true
    region: overseas