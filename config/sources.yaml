# Oasisic-IPTV 采集源配置（唯一真实来源）
# 添加新源：复制下面模板，填 key/url/type/region，下次 collect 自动生效。
#
# 模板：
#   - key: "unique_key"          # 全局唯一
#     url: "https://example.com/live.m3u"
#     type: "m3u"                 # m3u | txt
#     enabled: true
#     region: cn                 # cn | hk_tw | hotel | overseas | radio
#     priority: 50               # 越小越优先
#     core: false                # 核心源失败只告警，不自动禁用

sources:
  # ── 核心：中文目录制标杆 ────────────────────────────
  - key: "fanmingming-ipv6"
    url: "https://raw.githubusercontent.com/fanmingming/live/main/tv/m3u/ipv6.m3u"
    type: "m3u"
    enabled: true
    region: cn
    priority: 10
    core: true
    # 一台一链标杆，IPv6 中文直播

  - key: "fanmingming-itv"
    url: "https://raw.githubusercontent.com/fanmingming/live/main/tv/m3u/itv.m3u"
    type: "m3u"
    enabled: true
    region: cn
    priority: 15
    core: true
    # fanmingming ITV 切片，补充 ipv6 列表未覆盖的台

  - key: "yuechan-cn"
    url: "https://raw.githubusercontent.com/YueChan/Live/main/IPTV.m3u"
    type: "m3u"
    enabled: true
    region: cn
    priority: 20
    core: true
    # 精选体量小、命名干净

  # ── 国内日更聚合 ────────────────────────────────────
  - key: "zbds-iptv4"
    url: "https://live.zbds.top/tv/iptv4.m3u"
    type: "m3u"
    enabled: true
    region: cn
    priority: 25
    core: false
    # vbskycn/zbds IPv4 日更（与 raw vbskycn 同内容，只保留这一条）

  - key: "guovin-iptv-api"
    url: "https://raw.githubusercontent.com/Guovin/iptv-api/gd/output/result.m3u"
    type: "m3u"
    enabled: true
    region: cn
    priority: 30
    core: false
    # 体量大，作备份 URL 来源；不作为主列表首选

  - key: "hujingguang-cntv"
    url: "https://raw.githubusercontent.com/hujingguang/ChinaIPTV/main/cnTV_AutoUpdate.m3u8"
    type: "m3u"
    enabled: true
    region: cn
    priority: 32
    core: false
    # 国内自动更新，体量小、干净

  - key: "yang-gather"
    url: "https://raw.githubusercontent.com/YanG-1989/m3u/main/Gather.m3u"
    type: "m3u"
    enabled: true
    region: cn
    priority: 34
    core: false
    # 日更 Gather，中文为主

  - key: "zilong-best"
    url: "https://raw.githubusercontent.com/zilong7728/Collect-IPTV/main/best_sorted.m3u"
    type: "m3u"
    enabled: true
    region: cn
    priority: 36
    core: false
    # 已排序精选

  - key: "tianmutnt"
    url: "https://raw.githubusercontent.com/TianmuTNT/iptv/main/iptv.m3u"
    type: "m3u"
    enabled: true
    region: cn
    priority: 38
    core: false
    # 日更中文列表

  - key: "suxuang-ipv4"
    url: "https://raw.githubusercontent.com/suxuang/myIPTV/main/ipv4.m3u"
    type: "m3u"
    enabled: true
    region: cn
    priority: 39
    core: false
    # 卫视覆盖较好

  - key: "suxuang-ipv6"
    url: "https://raw.githubusercontent.com/suxuang/myIPTV/main/ipv6.m3u"
    type: "m3u"
    enabled: true
    region: cn
    priority: 40
    core: false
    # IPv6 补充

  - key: "mymsnn-tier-a"
    url: "https://raw.githubusercontent.com/mymsnn/DailyIPTV/main/outputs/tier_a.m3u"
    type: "m3u"
    enabled: true
    region: cn
    priority: 42
    core: false
    # DailyIPTV A 级（质量分级）

  - key: "mymsnn-tier-b"
    url: "https://raw.githubusercontent.com/mymsnn/DailyIPTV/main/outputs/tier_b.m3u"
    type: "m3u"
    enabled: true
