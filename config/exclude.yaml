# 名称黑名单：命中即丢弃（不进主列表、不进 live_more），用于过滤非直播长尾
#
# 设计原则：只拦「明显不是直播频道」的模式（点播回看、购物、测试、引流、博彩），
# 宁可少拦不可错杀——地方台、付费频道、海外台一律放行，交给分类与选优处理。
# 修改后跑： python -m pytest tests/test_exclude.py -q && python scripts/collect.py

patterns:
  - "\\d{4}\\s*年?春晚"        # 历年春晚回看（点播内容）
  - "春晚"                     # 任何含「春晚」的条目（点播回看，不是直播频道）
  - "^(4K|8K|HD|SD|FHD|UHD|超清|高清)$"   # 纯画质标签名
  - "^[A-Z]{1,5}\\d{0,2}$"                 # 短大写代号（CH5 / M2 / NU …）
  - "^\\d{2,}\\s"                          # 数字开头的点播节目名（如「28 AI 智慧赛马」）
  - "^\\d{2,}(?=[\\u4e00-\\u9fff])"        # 年份前缀的影视点播名（如「83射雕英雄传」）
  - "斗地主|棋牌|棋牌室|打牌"
  - "购物|商城|shopping"
  - "测试|试看|试用|demo|样本"
  - "加群|客服|代理|导航站|威信|微信|QQ\\s*群|telegram"
  - "成人|福利片|性感|深夜档"
  - "彩票|博彩|娱乐场|赌博"
  - "预告|片花|彩蛋|花絮"
  - "^\\s*[\\d\\s+\\-.、]+\\s*$"   # 纯数字/纯符号名