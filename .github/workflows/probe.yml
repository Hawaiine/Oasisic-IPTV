# 可选增强：地域测活（self-hosted）
#
# 主日更在 collect.yml（云端必跑）。本 workflow 仅在已部署
# Hawaiine/oasisic-runner（标签 self-hosted,iptv）时有意义。
# 未部署 runner 时：请保持本 workflow 禁用，或忽略 queued job；
# 不影响 live.m3u 日更。
#
# 镜像：barryallen26/oasisic-runner:latest
# 文档：https://github.com/Hawaiine/oasisic-runner

name: probe

on:
  workflow_dispatch:            # 有 runner 时手动测活
  workflow_run:
    workflows: [collect]
    types:
      - completed
  # 部署 runner 并确认在线后，可取消下一行注释启用定时测活
  # schedule:
  #   - cron: '30 22 * * *'    # UTC 22:30 = 北京 06:30

permissions:
  contents: write

jobs:
  probe:
    # 硬标签：self-hosted + iptv（与 oasisic-runner 默认 RUNNER_LABELS 对齐）
    runs-on: [self-hosted, iptv]
    timeout-minutes: 60
    # collect 失败时不跟跑；手动 dispatch 始终可跑
    if: >-
      github.event_name != 'workflow_run'
      || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 镜像已含 Python3+venv，禁止 setup-python（无 Node 会挂）
      - name: 安装依赖
        run: |
          pip install -r scripts/requirements.txt

      - name: 采集 + 测活
        env:
          PROBE_ENABLED: 'true'
          PROBE_CONCURRENCY: '20'
          PROBE_TIMEOUT: '10'
          MAX_KEEP_PER_CHANNEL: '1'
          PROBE_REGION: 'wuhan-unicom'
          STRICT_SOURCES: '1'
        run: python scripts/collect.py

      - name: 标记失效源
        continue-on-error: true
        run: python scripts/flag_dead_sources.py

      - name: 验证输出
        run: python scripts/verify_outputs.py

      - name: 工程报告
        continue-on-error: true
        run: python scripts/generate_report.py

      - name: 提交（仅 output / 源健康相关）
        run: |
          git config user.name "Oasisic-IPTV Bot"
          git config user.email "hawaiine@users.noreply.github.com"
          git add \
            output/live_verified.m3u \
            output/*.m3u \
            output/check_result.json \
            config/sources.yaml \
            data/source_history.json \
            CHANGELOG.md
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            TZ='Asia/Shanghai' date '+📡 测活完成 %Y-%m-%d %H:%M' > /tmp/commit_msg.txt
            git commit -F /tmp/commit_msg.txt
            git pull --rebase origin main
            git push origin main
          fi

      - name: Discord 通知
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        continue-on-error: true
        run: python scripts/send_discord.py
