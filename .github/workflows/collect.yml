name: collect

on:
  schedule:
    - cron: '0 22 * * *'       # UTC 22:00 = Beijing 06:00
  workflow_dispatch:            # 手动触发

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: 采集（无测活）
        env:
          PROBE_ENABLED: 'false'
          STRICT_SOURCES: '1'
        run: python scripts/collect.py

      - name: 验证输出
        run: python scripts/verify_outputs.py

      - name: 准备提交
        run: |
          git config user.name "Oasisic-IPTV Bot"
          git config user.email "hawaiine@users.noreply.github.com"
          git add \
            output/*.m3u \
            output/check_result.json \
            config/ \
            scripts/ \
            data/channels.json \
            data/aliases.json \
            tests/
          # 若没有变化则不提交
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            TZ='Asia/Shanghai' date '+📺 每日采集 %Y-%m-%d %H:%M' > /tmp/commit_msg.txt
            git commit -F /tmp/commit_msg.txt
            git pull --rebase origin main
            git push origin main
          fi

      - name: Discord 通知
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        continue-on-error: true
        run: python scripts/send_discord.py