name: collect

on:
  schedule:
    - cron: "0 22 * * *"   # UTC 22:00 = 北京时间 06:00
  workflow_dispatch:

permissions:
  contents: write

env:
  # guide.xml 已移出 git（5.5MB+），仅作为 CI 产物留存。
  # 如需历史版本，使用 GitHub Actions Artifacts 或 Release。
  GUIDE_IN_GIT: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 单元测试
        run: pytest tests/ -q

      - name: 源配置校验
        run: python scripts/manage_sources.py validate

      - name: EPG 对齐并刷新缺口清单（低于阈值时保留旧映射）
        run: |
          if python scripts/sync_epg_ids.py; then
            echo 'EPG 映射与缺口清单已刷新'
          else
            echo '::warning::EPG 对齐未达覆盖阈值；保留旧映射，继续 M3U 日更'
          fi

      - name: 采集
        run: python scripts/collect.py

      - name: 输出校验
        run: python scripts/verify_outputs.py

      - name: 生成报告
        run: python scripts/generate_report.py --write-changelog

      - name: EPG 裁剪（失败告警，不阻断）
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if python scripts/fetch_epg.py; then
            echo 'EPG 裁剪成功'
          else
            echo '⚠️ EPG 失败，M3U 日更继续'
            DISCORD_MESSAGE="⚠️ Oasisic-IPTV EPG 拉取/裁剪失败，M3U 日更不受影响" \
              python scripts/send_discord.py || true
          fi

      - name: 发布 EPG 到 Release（滚动 tag epg-latest）
        if: hashFiles('output/guide.xml.gz') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view epg-latest >/dev/null 2>&1 || \
            gh release create epg-latest --title "EPG（滚动更新）" \
              --notes "多上游合并 + 按标准表裁剪的 XMLTV 节目单，每次采集覆盖更新。" --prerelease
          gh release upload epg-latest output/guide.xml output/guide.xml.gz --clobber

      - name: 发布每日快照（保留最近 30 个 daily-* Release）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="daily-$(TZ=Asia/Shanghai date '+%Y-%m-%d')"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "每日订阅快照 ${TAG#daily-}" \
              --notes "Oasisic-IPTV 每日采集快照。滚动保留最近 30 个 daily-* 版本；EPG 使用独立滚动 Release epg-latest。" \
              --prerelease
          fi
          gh release upload "$TAG" \
            output/live.m3u output/live_more.m3u output/live_backup.m3u \
            output/live.txt output/live_lite.txt output/live_more.txt output/live_radio.txt \
            output/status.json --clobber
          python3 - <<'PY'
          import json, re, subprocess
          releases = json.loads(subprocess.check_output([
              "gh", "release", "list", "--limit", "100", "--json", "tagName"
          ], text=True))
          daily = sorted(
              (r["tagName"] for r in releases if re.fullmatch(r"daily-\d{4}-\d{2}-\d{2}", r["tagName"])),
              reverse=True,
          )
          expired = daily[30:]
          for tag in expired:
              subprocess.run(["gh", "release", "delete", tag, "--cleanup-tag", "--yes"], check=True)
              print(f"🧹 已清理过期快照 {tag}")
          print(f"✅ daily 快照保留 {min(len(daily), 30)} 个；epg-latest 独立保留")
          PY

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: oasisic-iptv-output
          path: |
            output/
            !output/*.xml
            output/guide.xml
          if-no-files-found: warn
          retention-days: 30

      - name: 脱敏扫描
        run: |
          PAT1='ghp_'"[A-Za-z0-9]{20,}"
          PAT2='github_pat_'"[A-Za-z0-9_]{20,}"
          PAT3='DISCORD_WEBHOOK=''https://discord'
          PAT4='xox[baprs]-'
          if grep -RInE --exclude-dir=.git --exclude-dir=.venv --exclude-dir=.pytest_cache \
            --exclude='*.yml' "${PAT1}|${PAT2}|${PAT3}|${PAT4}" .; then
            echo '❌ 发现疑似密钥'
            exit 1
          fi
          echo '✅ 脱敏扫描通过'

      - name: 提交日更结果
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          git add \
            output/live.m3u \
            output/live_more.m3u \
            output/live_cctv.m3u \
            output/live_weishi.m3u \
            output/live_local.m3u \
            output/live_gangtai.m3u \
            output/live_sports.m3u \
            output/live_live.m3u \
            output/live_radio.m3u \
            output/live_backup.m3u \
            output/live.txt \
            output/live_lite.txt \
            output/live_more.txt \
            output/live_radio.txt \
            output/status.json \
            data/channels.json \
            data/epg_missing.txt \
            data/source_stats.json \
            config/sources.yaml \
            CHANGELOG.md
          git diff --cached --quiet && echo '无变更' && exit 0
          DATE=$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')
          git commit -m "📺 每日采集 ${DATE}"
          git push origin HEAD

      - name: Discord 通知
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python scripts/send_discord.py
